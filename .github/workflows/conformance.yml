name: h2spec

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

jobs:
  conformance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['4.0', '4.1.0-preview1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: ${{ matrix.ruby-version }}
      - name: Install dependencies
        run: |
          gem --version
          gem install bundler
          bundle --version
          bundle install
      - name: Install h2spec
        run: |
          set -eu
          curl -Ls https://github.com/summerwind/h2spec/releases/download/v2.6.0/h2spec_linux_amd64.tar.gz | tar xz
          mkdir -p $GITHUB_WORKSPACE/bin
          mv h2spec $GITHUB_WORKSPACE/bin/h2spec
          chmod +x $GITHUB_WORKSPACE/bin/h2spec
          echo $GITHUB_WORKSPACE/bin >> $GITHUB_PATH
      - name: Run conformance test
        run: bundle exec rake conformance
      - uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        if: success()
        with:
          report_paths: conformance/reports/h2spec.xml
          detailed_summary: true
